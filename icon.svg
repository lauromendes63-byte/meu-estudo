<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente Perolado Suave Full-Bleed (Preenchimento Completo para Ícone Adaptativo Android / One UI) -->
    <linearGradient id="bgPearl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9f2" />
      <stop offset="48%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e6f2ff" />
    </linearGradient>

    <!-- Brilho Radial Ciano/Azul Sutil no Canto Superior Direito -->
    <radialGradient id="topRightGlow" cx="88%" cy="16%" r="55%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0" />
    </radialGradient>

    <!-- Brilho Quente Sutil no Canto Inferior Esquerdo -->
    <radialGradient id="bottomLeftGlow" cx="12%" cy="84%" r="55%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ffedd5" stop-opacity="0" />
    </radialGradient>

    <!-- Gradiente Azul Marinho Profundo (Tema Oficial do App) -->
    <linearGradient id="navyStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2e63" />
      <stop offset="100%" stop-color="#132147" />
    </linearGradient>
  </defs>

  <!-- Fundo Full-Bleed (512x512 sem corte interno: o Android One UI aplica sua máscara squircle perfeita de borda a borda) -->
  <rect width="512" height="512" fill="url(#bgPearl)" />
  <rect width="512" height="512" fill="url(#topRightGlow)" />
  <rect width="512" height="512" fill="url(#bottomLeftGlow)" />

  <!-- Símbolo Minimalista: Capelo Acadêmico + Livro Aberto em Azul Marinho (#162654) Centralizado na Safe-Zone (80% / 410px) -->
  <g transform="translate(256, 256) scale(0.74) translate(-256, -266)">
    <g fill="none" stroke="url(#navyStroke)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
      <!-- Topo do Capelo (Losango Superior) -->
      <path d="M 256 96 L 424 174 L 256 252 L 88 174 Z" />

      <!-- Base do Capelo (Coroa com Curvatura Central em V) -->
      <path d="M 164 210 V 284 C 198 290, 230 308, 256 332 C 282 308, 314 290, 348 284 V 210" />

      <!-- Cordão do Pendente (Direita) -->
      <path d="M 398 187 V 256" stroke-width="24" />

      <!-- Livro Aberto: Par Superior de Páginas -->
      <path d="M 86 346 C 154 338, 222 364, 256 416 C 290 364, 358 338, 426 346" />

      <!-- Livro Aberto: Par Inferior de Páginas + Lombada Central -->
      <path d="M 86 402 C 152 394, 212 410, 242 432 Q 256 440 270 432 C 300 410, 360 394, 426 402" />
      <line x1="256" y1="410" x2="256" y2="434" />
    </g>

    <!-- Cápsula Final do Pendente do Capelo -->
    <rect x="383" y="242" width="30" height="44" rx="13" fill="url(#navyStroke)" />
  </g>
</svg>
