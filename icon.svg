<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircle for Android -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Medical Cross / Notebook Spine Concept -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Caduceus / Rod of Asclepius & Stethoscope Stylized Hybrid -->
    <!-- Circular Pulse Ring -->
    <circle r="140" fill="none" stroke="#1e293b" stroke-width="8" stroke-dasharray="12 12" />
    <circle r="140" fill="none" stroke="url(#primaryGrad)" stroke-width="8" stroke-dasharray="110 330" stroke-linecap="round" transform="rotate(-45)" />

    <!-- Medical Notebook Base -->
    <rect x="-90" y="-120" width="180" height="240" rx="24" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="4" />
    <line x1="-55" y1="-120" x2="-55" y2="120" stroke="#0f172a" stroke-width="6" />

    <!-- Pulse Line / ECG across page -->
    <path d="M-40,20 L-10,20 L5,-25 L20,45 L35,-10 L45,20 L70,20" fill="none" stroke="url(#primaryGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Spaced Repetition Dots (D+1, D+7, D+30) -->
    <circle cx="-15" cy="-60" r="10" fill="#10b981" />
    <circle cx="20" cy="-60" r="10" fill="#06b6d4" />
    <circle cx="55" cy="-60" r="10" fill="#818cf8" />

    <!-- Medical Cross Badge in Bottom Right -->
    <circle cx="85" cy="85" r="38" fill="url(#primaryGrad)" />
    <path d="M85,63 L85,107 M63,85 L107,85" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
