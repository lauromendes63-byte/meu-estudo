<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Dark-Slate Luxury Background Gradient (Reumato Aesthetic) -->
    <linearGradient id="bgSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="45%" stop-color="#273244" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Subtle Metallic Inner Rim -->
    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#475569" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.5" />
    </linearGradient>

    <!-- Soft Clinical Glows -->
    <radialGradient id="emeraldHalo" cx="50%" cy="48%" r="44%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Elevation Shadow -->
    <filter id="crestShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Squircle Base -->
  <rect width="512" height="512" rx="124" fill="url(#bgSlate)" />
  <rect width="496" height="496" x="8" y="8" rx="116" fill="none" stroke="url(#rimStroke)" stroke-width="6" />

  <!-- Ambient Focal Halo (Reumato-style radial aura) -->
  <circle cx="256" cy="252" r="200" fill="url(#emeraldHalo)" />
  <circle cx="256" cy="256" r="130" fill="#ef4444" fill-opacity="0.10" />

  <!-- Main Anatomical & Medical Crest -->
  <g transform="translate(256, 256)" filter="url(#crestShadow)">
    <!-- Translucent White Layered Medical Cross (Duotone Depth) -->
    <path d="M-46,-136 H46 A28,28 0 0 1 74,-108 V-74 H108 A28,28 0 0 1 136,-46 V46 A28,28 0 0 1 108,74 H74 V108 A28,28 0 0 1 46,136 H-46 A28,28 0 0 1 -74,108 V74 H-108 A28,28 0 0 1 -136,46 V-46 A28,28 0 0 1 -108,-74 H-74 V-108 A28,28 0 0 1 -46,-136 Z"
          fill="#ffffff" fill-opacity="0.24" stroke="#ffffff" stroke-width="14" stroke-linejoin="round" />

    <!-- Inner Crisp White Anatomical Heart / Book Core -->
    <path d="M0,-68 C-28,-96 -78,-82 -86,-38 C-94,6 -48,46 0,86 C48,46 94,6 86,-38 C78,-82 28,-96 0,-68 Z"
          fill="#ffffff" fill-opacity="0.32" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Specular White Highlight (Left Ventricle / Crest Rim) -->
    <path d="M-54,-48 C-62,-28 -56,-6 -38,16"
          fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.88" />
    <path d="M-38,-112 H38"
          fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-opacity="0.75" />

    <!-- Vibrant Clinical ECG & Inflammation/Pulse Wave (High-Contrast Focal Accent) -->
    <path d="M-102,4 H-46 L-24,-46 L8,54 L32,-18 L52,4 H102"
          fill="none" stroke="#1e293b" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.55" />
    <path d="M-102,4 H-46 L-24,-46 L8,54 L32,-18 L52,4 H102"
          fill="none" stroke="#ef4444" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 3 Spaced Repetition Milestones (D+1, D+7, D+30) -->
    <circle cx="-44" cy="108" r="9" fill="#34d399" />
    <circle cx="0" cy="108" r="9" fill="#ffffff" />
    <circle cx="44" cy="108" r="9" fill="#34d399" />

    <!-- Outer Resonance Waves (Reumato Signature Detail) -->
    <path d="M158,-44 C176,-16 176,16 158,44" fill="none" stroke="#ef4444" stroke-width="11" stroke-linecap="round" />
    <path d="M182,-64 C206,-24 206,24 182,64" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-opacity="0.85" />
    <path d="M-158,-44 C-176,-16 -176,16 -158,44" fill="none" stroke="#34d399" stroke-width="11" stroke-linecap="round" />
    <path d="M-182,-64 C-206,-24 -206,24 -182,64" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-opacity="0.85" />
  </g>
</svg>
