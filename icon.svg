<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Crisp shadow for icon depth -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Clean Pure White Base with Subtle Border -->
  <rect width="512" height="512" rx="128" fill="#ffffff" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#e2e8f0" stroke-width="4" />

  <!-- Modern Minimalist Medical Cross & Notebook Concept -->
  <g transform="translate(256, 256)" filter="url(#cardShadow)">
    
    <!-- Central Medical Cross in Emerald Gradient -->
    <!-- Vertical Bar -->
    <rect x="-42" y="-120" width="84" height="240" rx="42" fill="url(#emeraldGrad)" />
    <!-- Horizontal Bar -->
    <rect x="-120" y="-42" width="240" height="84" rx="42" fill="url(#emeraldGrad)" />

    <!-- Pure White Central Iconography: Crisp Stethoscope / Pulse Wave -->
    <path d="M-65,0 L-30,0 L-15,-40 L10,45 L25,-15 L40,0 L65,0" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 3 Subtle Spaced Repetition Dots at the top (D+1, D+7, D+30) -->
    <circle cx="-50" cy="-70" r="8" fill="#ffffff" opacity="0.9" />
    <circle cx="0" cy="-70" r="8" fill="#ffffff" opacity="0.9" />
    <circle cx="50" cy="-70" r="8" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
